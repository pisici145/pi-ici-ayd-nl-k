<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e5">
  <title>PİŞİCİ AYDINLIK | İletişim</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;
      background:#f6f0e5;color:#30271f;font-family:Arial,Helvetica,sans-serif}
    main{width:min(100%,430px);background:#fffdf8;border:1px solid #e5d8c4;
      border-radius:22px;padding:32px 24px;box-shadow:0 12px 36px #4b38201a;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 18px;border:1px solid #b18a4a;
      border-radius:50%;display:grid;place-items:center;color:#8a642e;font-size:27px}
    h1{font-size:25px;letter-spacing:1.4px;margin:0 0 8px}
    .sub{color:#786b5d;font-size:14px;margin:0 0 28px}
    .person{padding:18px 0;border-top:1px solid #eee5d8}
    h2{font-size:18px;margin:0 0 13px}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{display:inline-block;text-decoration:none;border-radius:999px;padding:12px 18px;
      font-size:14px;font-weight:700}
    .call{background:#30271f;color:#fff}
    .wa{background:#e9dfce;color:#30271f}
    footer{margin-top:24px;color:#9a8b79;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>PİŞİCİ AYDINLIK</h1>
    <p class="sub">Geleneksel lezzetin adresi</p>

    <section class="person">
      <h2>Orhan Aydınlık</h2>
      <div class="actions">
        <a class="call" href="tel:+905365885655">Ara</a>
        <a class="wa" href="https://wa.me/905365885655">WhatsApp</a>
      </div>
    </section>

    <section class="person">
      <h2>Onur Aydınlık</h2>
      <div class="actions">
        <a class="call" href="tel:+905459133151">Ara</a>
        <a class="wa" href="https://wa.me/905459133151">WhatsApp</a>
      </div>
    </section>

    <footer>İletişim sayfası · PİŞİCİ AYDINLIK</footer>
  </main>
</body>
</html>
